name: Deploy WHAT IS REAL? to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify narrative and audio mapping
        run: npm test
      - name: Install owner-approved soundtrack from ZIP or original .wiraudio pack
        run: python3 scripts/unpack_audio_bundle.py
      - name: Build production website
        run: npm run build
      - name: Verify all nine hosted MP3s when soundtrack bundle is supplied
        run: |
          if [ -f WHAT_IS_REAL_V2_audio_for_GitHub.zip ] || [ -f WHAT_IS_REAL_audio_pack.wiraudio ]; then
            test -s dist/audio/background/atmosphere-loop.mp3
            for file in dist/audio/baseline/*.mp3; do test -s "$file"; done
            test "$(find dist/audio/baseline -name '*.mp3' | wc -l)" -eq 8
            echo "Background music + 8 baseline film recordings are in the published website."
          else
            echo "Soundtrack pack not yet uploaded: website still supports one-time browser audio import."
          fi
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload production website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish official website
        id: deployment
        uses: actions/deploy-pages@v4
