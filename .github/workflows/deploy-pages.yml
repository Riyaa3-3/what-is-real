name: Deploy WHAT IS REAL? to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify narrative and audio mapping
        run: npm test
      - name: Require and install approved public soundtrack
        run: |
          if [ ! -f WHAT_IS_REAL_audio_pack.wiraudio ] && [ ! -f WHAT_IS_REAL_V2_audio_for_GitHub.zip ]; then
            echo "::error::The public website must ship its nine approved audio tracks."
            exit 1
          fi
          python3 scripts/unpack_audio_bundle.py
      - name: Build production website
        run: npm run build
      - name: Verify all nine MP3 files in production build
        run: |
          test -s dist/audio/background/atmosphere-loop.mp3
          for name in cells-01-institution cells-02-cell cells-03-duties interlinked-01-hold-hand interlinked-02-finger interlinked-03-heart interlinked-04-dream within-cells-interlinked; do
            test -s "dist/audio/baseline/${name}.mp3"
          done
          test "$(find dist/audio/baseline -name '*.mp3' | wc -l)" -eq 8
          echo "All nine production MP3s are included; no visitor import required."
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload production website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish official website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify all nine MP3 URLs are publicly accessible
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for file in \
            background/atmosphere-loop.mp3 \
            baseline/cells-01-institution.mp3 \
            baseline/cells-02-cell.mp3 \
            baseline/cells-03-duties.mp3 \
            baseline/interlinked-01-hold-hand.mp3 \
            baseline/interlinked-02-finger.mp3 \
            baseline/interlinked-03-heart.mp3 \
            baseline/interlinked-04-dream.mp3 \
            baseline/within-cells-interlinked.mp3; do
            url="${SITE_URL%/}/audio/$file"
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -sS -L -I -o /dev/null -w '%{http_code}' --connect-timeout 12 --max-time 25 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "Verified public HTTP 200: $file"
                ok=1
                break
              fi
              echo "Waiting for public asset ($code): $file"
              sleep 4
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Visitor audio unavailable: $url"
              exit 1
            fi
          done
          echo "All nine public soundtrack URLs are accessible without login or uploads."

